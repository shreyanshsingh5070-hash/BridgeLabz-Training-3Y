<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="panel">
        <h1>Quick Search</h1>
        <p>Find what you need with these simple interface components.</p>
        <form class="search-row" action="#">
            <label for="search">Search</label>
            <input type="search" id="search" placeholder="Type something...">
            <button type="submit">Search</button>
        </form>
        <div class="actions">
            <button class="main-button" type="button">Get Started</button>
            <button class="light-button" type="button">Learn More</button>
        </div>
        <div class="select-area">
            <label for="category">Choose a category</label>
            <select id="category">
                <option>Web Design</option>
                <option>Development</option>
                <option>Photography</option>
                <option>Business</option>
            </select>
        </div>
    </main>
</body>
</html>
