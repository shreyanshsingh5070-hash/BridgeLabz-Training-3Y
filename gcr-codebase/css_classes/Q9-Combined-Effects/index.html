<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Combined CSS Effects</h1>
        <p>Hover over the cards and buttons to see the combined effects.</p>
        <section class="cards">
            <article class="card">
                <div class="symbol">✦</div>
                <h2>Creative</h2>
                <p>A little movement makes an interface feel lively.</p>
                <button type="button">Explore</button>
            </article>
            <article class="card">
                <div class="symbol">◇</div>
                <h2>Simple</h2>
                <p>Consistent spacing keeps the design easy to read.</p>
                <button type="button">Explore</button>
            </article>
            <article class="card">
                <div class="symbol">○</div>
                <h2>Modern</h2>
                <p>Soft shadows help each element stand out.</p>
                <button type="button">Explore</button>
            </article>
        </section>
    </main>
</body>
</html>
