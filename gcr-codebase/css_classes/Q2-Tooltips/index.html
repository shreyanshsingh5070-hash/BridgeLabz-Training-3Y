<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>CSS Tooltips</h1>
        <p>Hover over each item to read a little more.</p>
        <section class="tooltip-list">
            <div class="tip-item">
                <span class="tip">Home</span>
                <span class="tooltip">Go to the home page</span>
            </div>
            <div class="tip-item">
                <span class="tip">Search</span>
                <span class="tooltip">Find something on this site</span>
            </div>
            <div class="tip-item">
                <span class="tip">Profile</span>
                <span class="tooltip">View your account details</span>
            </div>
            <div class="tip-item">
                <span class="tip">Help</span>
                <span class="tooltip">Get help and support</span>
            </div>
        </section>
    </main>
</body>
</html>
