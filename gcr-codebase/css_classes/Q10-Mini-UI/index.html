<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#">BrightSpace</a>
        <nav>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section class="profile-card" id="contact">
            <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=700&q=80" alt="Bright and modern workspace">
            <div class="card-content">
                <h1>Let's Get in Touch</h1>
                <p>Send a quick message and we will get back to you.</p>
                <form action="#">
                    <label for="name">Your name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                    <label for="message">Message</label>
                    <textarea id="message" rows="3" placeholder="Write your message"></textarea>
                    <div class="form-buttons">
                        <button type="submit">Send Message</button>
                        <button class="cancel" type="reset">Clear</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer id="about">
        <p>© 2026 BrightSpace. Made for CSS practice.</p>
    </footer>
</body>
</html>
