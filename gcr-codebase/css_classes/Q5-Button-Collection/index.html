<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Button Style Collection</h1>
        <p>Hover, click or use the keyboard to check each button state.</p>
        <section class="buttons">
            <button class="primary">Primary Button</button>
            <button class="secondary">Secondary Button</button>
            <button class="outline">Outline Button</button>
            <button class="disabled" disabled>Disabled Button</button>
        </section>
    </main>
</body>
</html>
