<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>

<body>

    <h1 title="School Name">GD Global School</h1>

    <h2>Student Report Card</h2>

    <table border="1" title="Student Marks Report">

        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>78</td>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Physics</td>
            <td>100</td>
            <td>72</td>
        </tr>

        <tr>
            <td>Chemistry</td>
            <td>100</td>
            <td>80</td>
        </tr>

        <tr>
            <td>Computer Science</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <th colspan="2">Total</th>
            <td>405 / 500</td>
        </tr>

        <tr>
            <th colspan="2">Percentage</th>
            <td>81%</td>
        </tr>

    </table>

    <p title="Report information">
        Result: Passed
    </p>

</body>
</html>
