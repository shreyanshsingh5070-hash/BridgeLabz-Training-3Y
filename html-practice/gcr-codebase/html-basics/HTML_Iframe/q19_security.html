<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Form Security</title></head>
<body>
    <!-- Student Details -->
    <p>
        Name: Shreyansh Singh<br>
        Class: 57<br>
        Class Roll No.: 2415001542<br>
        College Roll No.: 2415001542
    </p>

    <h1>Secure Form</h1>
    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <input type="submit" value="Submit">
    </form>
    <p>Turning off autocomplete can improve security by preventing the browser from automatically storing or filling sensitive information.</p>
</body>
</html>
