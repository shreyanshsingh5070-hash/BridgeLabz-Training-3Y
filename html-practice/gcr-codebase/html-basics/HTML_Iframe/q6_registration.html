<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>User Registration</title></head>
<body>

    <p>
        Name: Shreyansh Singh<br>
        Class: 57<br>
        Class Roll No.: 2415001542<br>
        College Roll No.: 2415001542

    <h1>User Registration Form</h1>
    <form action="#" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="fullname" required><br><br>
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <label for="confirm">Confirm Password:</label>
        <input type="password" id="confirm" name="confirm_password" required><br><br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
