<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Title defines the title shown in the browser tab -->
    <title>Important Head Elements</title>
    <!-- Meta charset defines the character encoding -->
    <meta charset="UTF-8">
    <!-- Meta description provides a description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements">
    <!-- Meta author specifies the author of the webpage -->
    <meta name="author" content="Student">
    <!-- Base sets the base URL for relative links -->
    <base href="https://example.com/">
    <!-- Link connects external resources such as a favicon -->
    <link rel="icon" href="favicon.ico">
    <!-- Style contains CSS; kept empty as required -->
    <style></style>
    <!-- Script is used for JavaScript; kept empty as required -->
    <script></script>
</head>
<body>
    <!-- Student Details -->
    <p>
        Name: Shreyansh Singh<br>
        Class: 57<br>
        Class Roll No.: 2415001542<br>
        College Roll No.: 2415001542
    </p>

    <h1>Important Head Elements</h1>
    <p>This page demonstrates important HTML elements used inside the head section.</p>
</body>
</html>
