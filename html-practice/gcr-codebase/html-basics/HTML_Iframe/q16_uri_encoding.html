<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>URI Encoding</title></head>
<body>
    <!-- Student Details -->
    <p>
        Name: Shreyansh Singh<br>
        Class: 57<br>
        Class Roll No.: 2415001542<br>
        College Roll No.: 2415001542
    </p>

    <h1>URI Encoding</h1>
    <!-- Spaces are represented using %20 and ampersand using %26 -->
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Search HTML and CSS</a>
    <p>Encoded URL: https://example.com/search?query=HTML%20%26%20CSS</p>
</body>
</html>
