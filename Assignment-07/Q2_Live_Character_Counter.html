<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Character Counter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    textarea { display: block; width: 320px; height: 120px; padding: 10px; }
    #counter { margin: 8px 0; color: green; }
    #counter.warning { color: #d69e00; }
    #counter.limit { color: red; }
  </style>
</head>
<body>
  <h2>Live Character Counter</h2>
  <textarea id="message" maxlength="100" placeholder="Type up to 100 characters"></textarea>
  <p id="counter">100 characters remaining</p>
  <button id="resetButton">Reset</button>
  <script src="Q2_Live_Character_Counter.js"></script>
</body>
</html>
