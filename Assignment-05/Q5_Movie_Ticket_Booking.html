<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 440px; margin: 40px auto; padding: 20px; }
        label { display: block; margin-top: 14px; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; }
        button { margin-top: 16px; padding: 10px 18px; }
        pre { background: #f2f2f2; padding: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Movie Ticket Booking</h2>
    <form id="bookingForm">
        <label for="bookingName">Name</label>
        <input id="bookingName" type="text" required>

        <label for="bookingEmail">Email</label>
        <input id="bookingEmail" type="text" required>

        <label for="bookingSeats">Seats (1–10)</label>
        <input id="bookingSeats" type="number" min="1" max="10" required>

        <button type="submit">Book Ticket</button>
    </form>
    <p id="bookingMessage"></p>
    <pre id="ticketDetails"></pre>
    <script src="Q5_Movie_Ticket_Booking.js"></script>
</body>
</html>
