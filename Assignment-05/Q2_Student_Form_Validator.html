<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form Validator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 440px; margin: 40px auto; padding: 20px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; border: 2px solid #aaa; border-radius: 5px; }
        input.valid { border-color: green; }
        input.invalid { border-color: red; }
        .error { color: red; font-size: 13px; min-height: 16px; }
        button { margin-top: 16px; padding: 10px 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Student Registration</h2>
    <form id="studentForm" novalidate>
        <label for="name">Name</label>
        <input id="name" type="text">
        <div class="error"></div>

        <label for="email">Email</label>
        <input id="email" type="text">
        <div class="error"></div>

        <label for="phone">Phone</label>
        <input id="phone" type="text">
        <div class="error"></div>

        <label for="password">Password</label>
        <input id="password" type="password">
        <div class="error"></div>

        <button type="submit">Register</button>
        <p id="formMessage"></p>
    </form>
    <script src="Q2_Student_Form_Validator.js"></script>
</body>
</html>
