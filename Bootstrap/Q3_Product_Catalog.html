<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Q3_Product_Catalog.css">
</head>
<body>
  <header class="bg-dark text-white py-4"><div class="container"><h1 class="h2 mb-0">Everyday Goods</h1><p class="mb-0 text-white-50">Useful products for better living</p></div></header>
  <main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div><h2 class="fw-bold mb-1">Featured Products</h2><p class="text-secondary mb-0">Thoughtfully selected essentials</p></div>
      <span class="badge text-bg-primary">New collection</span>
    </div>
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-3"><article class="card product-card h-100 shadow-sm"><img src="https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=700&q=80" class="card-img-top" alt="Minimal desk lamp"><div class="card-body"><h3 class="h5">Studio Lamp</h3><p class="fw-bold">₹1,499</p><a href="#" class="btn btn-outline-primary w-100">Add to Cart</a></div></article></div>
      <div class="col-12 col-sm-6 col-md-3"><article class="card product-card h-100 shadow-sm"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80" class="card-img-top" alt="Classic wrist watch"><div class="card-body"><h3 class="h5">Classic Watch</h3><p class="fw-bold">₹2,299</p><a href="#" class="btn btn-outline-primary w-100">Add to Cart</a></div></article></div>
      <div class="col-12 col-sm-6 col-md-3"><article class="card product-card h-100 shadow-sm"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80" class="card-img-top" alt="Red running shoe"><div class="card-body"><h3 class="h5">Active Sneakers</h3><p class="fw-bold">₹3,499</p><a href="#" class="btn btn-outline-primary w-100">Add to Cart</a></div></article></div>
      <div class="col-12 col-sm-6 col-md-3"><article class="card product-card h-100 shadow-sm"><img src="https://images.unsplash.com/photo-1512499617640-c74ae3a79d37?auto=format&fit=crop&w=700&q=80" class="card-img-top" alt="Travel backpack"><div class="card-body"><h3 class="h5">City Backpack</h3><p class="fw-bold">₹1,899</p><a href="#" class="btn btn-outline-primary w-100">Add to Cart</a></div></article></div>
    </div>
  </main>
  <footer class="bg-light text-center py-4 text-secondary">© 2026 Everyday Goods</footer>
</body>
</html>
