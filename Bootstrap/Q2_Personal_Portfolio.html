<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Q2_Personal_Portfolio.css">
</head>
<body class="bg-light text-dark">
  <header class="bg-white border-bottom">
    <div class="container text-center py-4">
      <h1 class="fw-bold mb-1">Alex Morgan</h1>
      <p class="text-secondary mb-0">Frontend Developer · Creative Problem Solver</p>
    </div>
  </header>
  <main class="container my-5">
    <section class="bg-white rounded-4 shadow-sm p-5 text-center">
      <img class="img-fluid rounded-circle profile-image mb-4" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=85" alt="Portrait of Alex Morgan">
      <h2 class="fw-bold">Hello, I'm Alex.</h2>
      <p class="lead mx-auto intro-text">I build accessible, responsive web experiences with a focus on clean design and useful details.</p>
      <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-primary">Download CV</a>
    </section>
    <section id="contact" class="row justify-content-center mt-5">
      <div class="col-lg-6">
        <h2 class="text-center fw-bold mb-3">Get in touch</h2>
        <form class="bg-white p-4 rounded-3 shadow-sm">
          <label for="email" class="form-label">Email address</label>
          <input id="email" type="email" class="form-control mb-3" placeholder="you@example.com">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" class="form-control mb-3" rows="4" placeholder="Tell me about your project"></textarea>
          <button class="btn btn-dark w-100" type="button">Send Message</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="text-center text-secondary py-4"><small>© 2026 Alex Morgan · Portfolio</small></footer>
</body>
</html>
