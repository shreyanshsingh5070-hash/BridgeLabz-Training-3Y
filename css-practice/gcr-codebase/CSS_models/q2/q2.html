<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Height and Width Practice</title>
  <link rel="stylesheet" href="q2.css">
</head>
<body>
  <main class="stage">
    <section class="size-box box-px">
      <p>200px &times; 120px<br>fixed size</p>
    </section>
    <section class="size-box box-percent">
      <p>50% width<br>min-height demo</p>
    </section>
    <section class="size-box box-vh-em">
      <p>30vh height<br>20em max-width<br>overflow: auto</p>
      <p>Extra content to demonstrate scrolling once the box height is exceeded by its content.</p>
    </section>
  </main>
</body>
</html>
