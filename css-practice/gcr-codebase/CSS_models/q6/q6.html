<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="q6.css">
</head>
<body>
  <main class="transform-row">
    <div class="transform-item">
      <div class="box box-rotate"></div>
      <p>rotate()</p>
    </div>
    <div class="transform-item">
      <div class="box box-scale"></div>
      <p>scale()</p>
    </div>
    <div class="transform-item">
      <div class="box box-translate"></div>
      <p>translate()</p>
    </div>
    <div class="transform-item">
      <div class="box box-skew"></div>
      <p>skew()</p>
    </div>
  </main>
</body>
</html>
