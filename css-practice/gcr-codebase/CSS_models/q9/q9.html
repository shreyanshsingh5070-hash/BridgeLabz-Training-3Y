<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outline and Focus Styling</title>
  <link rel="stylesheet" href="q9.css">
</head>
<body>
  <main class="form-wrap">
    <form class="contact-form">
      <h1>Get in Touch</h1>

      <label for="name">Name</label>
      <input type="text" id="name" class="outline-solid" placeholder="Your name">

      <label for="email">Email</label>
      <input type="email" id="email" class="outline-dashed" placeholder="you@example.com">

      <label for="message">Message</label>
      <textarea id="message" class="outline-dotted" rows="4" placeholder="Write your message..."></textarea>

      <button type="button">Send Message</button>
    </form>
  </main>
</body>
</html>
