<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shadows and Depth Effect</title>
  <link rel="stylesheet" href="q4.css">
</head>
<body>
  <main class="card-row">
    <section class="depth-card card-soft">
      <h2>Soft Shadow</h2>
      <p>A subtle, close shadow for a gentle lift off the page.</p>
    </section>

    <section class="depth-card card-sharp">
      <h2>Sharp Shadow</h2>
      <p>A tighter, darker shadow for a crisp, defined edge.</p>
    </section>

    <section class="depth-card card-layered">
      <h2>Layered Shadow</h2>
      <p>Multiple stacked shadows create a richer sense of depth.</p>
    </section>
  </main>
</body>
</html>
